name: Public sections and 3D hero review
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/test-public-sections.mjs'
      - '.github/workflows/public-sections-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/test-public-sections.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-sections-${{ github.sha }}
          path: /tmp/brand-menu-previews/public-sections/
          retention-days: 30
