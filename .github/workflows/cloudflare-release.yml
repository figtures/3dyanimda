name: Cloudflare release packaging
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-release.yml'
      - 'scripts/cloudflare/**'
      - 'scripts/quality/release-*.mjs'
      - 'scripts/quality/audit-approved-html.mjs'
      - 'scripts/quality/audit-search-contracts.mjs'
      - 'scripts/export-sites.mjs'
      - 'src/**'
      - 'public/**'
      - 'content/**'
      - 'scripts/quality/public-export-*'
      - 'docs/audits/**'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Approved export and dry-run (${{ matrix.brand }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        brand: [3dyanimda, 3dsanayi, maketyanimda, parcayanimda]
    env:
      SITE_DOMAIN: '${{ matrix.brand }}.com'
      WORKER_NAME: '${{ matrix.brand }}'
      WORKER_CUSTOM_DOMAIN: 'true'
      VITE_SITE_THEME: 'industrial'
      VITE_SUPABASE_URL: 'https://zdxjmhhjuomcpdtllnuq.supabase.co'
      VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_cb-5Z_xQf-Z19whnlsrG-A_Id5ewC6H'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build minimal Ubuntu runner without browser libraries
        run: docker build --build-arg RELEASE_UID="$(id -u)" -f scripts/cloudflare/minimal-runner.Dockerfile -t release-minimal scripts/cloudflare
      - name: Verify with missing browser libraries and no root privileges
        # Minimal Ubuntu reproduces the observed missing ATK and permission
        # failures; it is not Cloudflare's proprietary build image.
        run: |
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            -e SITE_DOMAIN -e WORKER_NAME -e WORKER_CUSTOM_DOMAIN \
            -e VITE_SITE_THEME -e VITE_SUPABASE_URL -e VITE_SUPABASE_PUBLISHABLE_KEY \
            -e WRANGLER_SEND_METRICS release-minimal '${{ matrix.brand }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloudflare-release-${{ matrix.brand }}-${{ github.sha }}
          path: |
            .cloudflare/${{ matrix.brand }}/wrangler.json
            .cloudflare/${{ matrix.brand }}/dry-run/
            .cloudflare/${{ matrix.brand }}/release/*-route-inputs.json
            .cloudflare/${{ matrix.brand }}/release/${{ matrix.brand }}.com/search-manifest.json
            artifacts/release/
            .cloudflare/browser-libraries/*/packages.json
          include-hidden-files: true
          retention-days: 30
