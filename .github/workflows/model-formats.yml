name: Model format preview regression
on:
  push:
    branches: [main]
    paths: ['src/lib/model-import/**', 'src/components/quote/**', 'deploy/security-headers.mjs', 'scripts/test-model-formats.mjs', 'scripts/fixtures/model-formats.mjs', '.github/workflows/model-formats.yml', 'vite.config.ts', 'package-lock.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-formats-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model-formats:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_PRIVATE_PREVIEW_HOST: '127.0.0.1'
      - run: node scripts/test-model-formats.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: model-formats-${{ github.sha }}
          path: /tmp/model-format-previews/
          retention-days: 14
