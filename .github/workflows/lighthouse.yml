name: Lighthouse candidate laboratory
# Full four-brand matrix after the validated lazy-startup and schema changes.

on:
  pull_request:
    branches: [main]
    paths: ['scripts/quality/lighthouse-ci.mjs', 'scripts/quality/lighthouse-evidence*', '.github/workflows/lighthouse.yml', 'src/**', 'public/**']
  push:
    branches: [main]
    paths: ['scripts/quality/lighthouse-ci.mjs', 'scripts/quality/lighthouse-evidence*', '.github/workflows/lighthouse.yml', 'src/**', 'public/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        brand: ${{ fromJSON(github.event_name == 'pull_request' && '["3dyanimda"]' || contains(github.event.head_commit.message, '[sanayi-mobile-recheck]') && '["3dsanayi"]' || contains(github.event.head_commit.message, '[perf-probe]') && '["3dyanimda"]' || '["3dyanimda","3dsanayi","maketyanimda","parcayanimda"]') }}
        device: ${{ fromJSON((contains(github.event.head_commit.message, '[sanayi-mobile-recheck]') || contains(github.event.head_commit.message, '[perf-probe]')) && '["mobile"]' || '["mobile","desktop"]') }}
    env:
      # Anonymous browser configuration only; no management or service-role secret.
      VITE_SUPABASE_URL: 'https://zdxjmhhjuomcpdtllnuq.supabase.co'
      VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_cb-5Z_xQf-Z19whnlsrG-A_Id5ewC6H'
      LAB_BRAND: ${{ matrix.brand }}
      LAB_DEVICE: ${{ matrix.device }}
      LAB_REPEATS: ${{ contains(github.event.head_commit.message, '[perf-probe]') && '1' || '3' }}
      LAB_ORIGIN_MODE: canonical
      # Explicit focused rechecks preserve the full default matrix for normal changes.
      # Home layout changes recheck all four brands and both devices on the affected route.
      # PRs compare the affected homepage with a service and the new flat local route before production.
      LAB_ROUTES: ${{ github.event_name == 'pull_request' && '/,/3d-baski,/istanbul-3d-baski' || contains(github.event.head_commit.message, '[home-flow]') && '/' || contains(github.event.head_commit.message, '[sanayi-mobile-recheck]') && '/teklif-al,/iletisim,/cozumler,/malzemeler,/rehber,/bolgeler' || contains(github.event.head_commit.message, '[perf-probe]') && '/,/bolgeler,/teklif-al' || contains(github.event.head_commit.message, '[quote-recheck]') && '/teklif-al' || '/,/3d-baski,/3d-tarama,/3d-modelleme,/teklif-al,/iletisim,/cozumler,/malzemeler,/rehber,/bolgeler' }}
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: google-chrome --version
      - run: node --test scripts/quality/lighthouse-evidence.test.mjs
      - run: node --test scripts/quality/critical-css.test.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - run: node scripts/quality/lighthouse-ci.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lighthouse-${{ matrix.brand }}-${{ matrix.device }}-${{ github.sha }}
          path: artifacts/lighthouse-${{ matrix.brand }}/
          retention-days: 30
          if-no-files-found: error
